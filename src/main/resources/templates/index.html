

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <meta charset="utf-8">
    <meta name="format-detection" content="telephone=no"/>
    <link rel="icon" href="images/favicon.ico">
    <link rel="shortcut icon" href="images/favicon.ico"/>
    <link rel="stylesheet" href="booking/css/booking.css">
    <link rel="stylesheet" href="css/camera.css">
    <link rel="stylesheet" href="css/owl.carousel.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jquery.js"></script>
    <script src="js/jquery-migrate-1.2.1.js"></script>
    <script src="js/script.js"></script>
    <script src="js/superfish.js"></script>
    <script src="js/jquery.ui.totop.js"></script>
    <script src="js/jquery.equalheights.js"></script>
    <script src="js/jquery.mobilemenu.js"></script>
    <script src="js/jquery.easing.1.3.js"></script>
    <script src="js/owl.carousel.js"></script>
    <script src="js/camera.js"></script>
    <!--[if (gt IE 9)|!(IE)]><!-->
    <script src="js/jquery.mobile.customized.min.js"></script>
    <!--<![endif]-->
    <script src="booking/js/booking.js"></script>
    <script>
        $(document).ready(function () {
            jQuery('#camera_wrap').camera({
                loader: false,
                pagination: false,
                minHeight: '444',
                thumbnails: false,
                height: '28.28125%',
                caption: true,
                navigation: true,
                fx: 'mosaic'
            });
            $().UItoTop({easingType: 'easeOutQuart'});
        });
    </script>
    <!--[if lt IE 8]>
    <div style=' clear: both; text-align:center; position: relative;'>
        <a href="http://windows.microsoft.com/en-US/internet-explorer/products/ie/home?ocid=ie6_countdown_bannercode">
            <img src="http://storage.ie6countdown.com/assets/100/images/banners/warning_bar_0000_us.jpg" border="0"
                 height="42" width="820"
                 alt="You are using an outdated browser. For a faster, safer browsing experience, upgrade for free today."/>
        </a>
    </div>
    <![endif]-->
    <!--[if lt IE 9]>
    <script src="js/html5shiv.js"></script>
    <link rel="stylesheet" media="screen" href="css/ie.css">
    <![endif]-->
</head>
<body class="page1" id="top">
<div class="main">

    <!--==============================header=================================-->
    <div th:insert="~{fragments/header :: header}"></div>
    <!--==============================slider=================================-->
    <div class="slider_wrapper">
        <div id="camera_wrap">
            <div data-src="images/slide.jpg"></div>
            <div data-src="images/slide1.jpg"></div>
            <div data-src="images/slide2.jpg"></div>
        </div>
    </div>

    <div class="container_12">
        <div class="grid_4">
            <div class="banner">
                <div class="maxheight">
                    <div class="banner_title">
                        <img src="images/icon1.png" alt="">
                        <div class="extra_wrapper">Fast&amp;
                            <div class="color1">Safe</div>
                        </div>
                    </div>
                    Travel with safety and speed across the globe.
                    <a href="#" class="fa fa-share-square"></a>
                </div>
            </div>
        </div>
        <div class="grid_4">
            <div class="banner">
                <div class="maxheight">
                    <div class="banner_title">
                        <img src="images/icon2.png" alt="">
                        <div class="extra_wrapper">Best
                            <div class="color1">Prices</div>
                        </div>
                    </div>
                    Affordable packages tailored to your budget.
                    <a href="#" class="fa fa-share-square"></a>
                </div>
            </div>
        </div>
        <div class="grid_4">
            <div class="banner">
                <div class="maxheight">
                    <div class="banner_title">
                        <img src="images/icon3.png" alt="">
                        <div class="extra_wrapper">Package
                            <div class="color1">Delivery</div>
                        </div>
                    </div>
                    Fast and reliable delivery services worldwide.
                    <a href="#" class="fa fa-share-square"></a>
                </div>
            </div>
        </div>
        <div class="clear"></div>
    </div>

    <div class="c_phone">
        <div class="container_12">
            <div class="grid_12">
                <div class="fa fa-phone"></div>+ 1800 559 6580
                <span>ORDER NOW!</span>
            </div>
        </div>
    </div>

    <!--==============================Content=================================-->
    <div class="content">
        <div class="container_12">
            <div class="grid_5">
                <h3>Booking Form</h3>
               <form id="bookingForm" th:action="@{/bookingForm}" method="post" th:object="${bookingForm}">
                    <div class="fl1">
                        <div class="tmInput">
                            <input th:field="*{name}" placeholder="Name:" type="text"/>
                            <span style="color:red" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                        </div>
                        <div class="tmInput">
                            <input th:field="*{from}" placeholder="From:" type="text"/>
                            <span style="color:red" th:if="${#fields.hasErrors('from')}" th:errors="*{from}"></span>
                        </div>
                    </div>
                    <div class="fl1">
                        <div class="tmInput">
                            <input th:field="*{email}" placeholder="Email:" type="text"/>
                            <span style="color:red" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                        </div>
                        <div class="tmInput mr0">
                            <input th:field="*{to}" placeholder="To:" type="text"/>
                            <span style="color:red" th:if="${#fields.hasErrors('to')}" th:errors="*{to}"></span>
                        </div>
                    </div>
                    <div class="clear"></div>
                    <strong>Time</strong>
                    <div class="tmInput">
                        <input th:field="*{time}" type="time"/>
                        <span style="color:red" th:if="${#fields.hasErrors('time')}" th:errors="*{time}"></span>
                    </div>
                    <div class="clear"></div>
                    <strong>Date</strong>
                    <label class="tmDatepicker">
                        <input th:field="*{date}" type="date"/>
                        <span style="color:red" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
                    </label>

                    <div class="clear"></div>
                    <div class="tmRadio">
                        <p>Comfort</p>
                        <input th:field="*{comfort}" type="radio" value="Cheap" id="tmRadio0"/>
                        <span>Cheap</span>
                        <input th:field="*{comfort}" type="radio" value="Standard" id="tmRadio1"/>
                        <span>Standard</span>
                        <input th:field="*{comfort}" type="radio" value="Lux" id="tmRadio2"/>
                        <span>Lux</span>
                        <span style="color:red" th:if="${#fields.hasErrors('comfort')}" th:errors="*{comfort}"></span>
                    </div>

                    <div class="clear"></div>
                    <div class="fl1 fl2">
                        <em>Adult</em>
                        <select th:field="*{adult}" class="tmSelect auto">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                        </select>
                        <span style="color:red" th:if="${#fields.hasErrors('adult')}" th:errors="*{adult}"></span>
                    </div>

                    <div class="fl1 fl2">
                        <em>Children</em>
                        <select th:field="*{children}" class="tmSelect auto">
                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>
                        <span style="color:red" th:if="${#fields.hasErrors('children')}" th:errors="*{children}"></span>
                    </div>

                    <div class="clear"></div>
                    <div class="tmTextarea">
                        <textarea th:field="*{message}" placeholder="Message"></textarea>
                    </div>
                    <button class="btn" type="submit">Submit</button>
                </form>
            </div>

            <div class="grid_6 prefix_1">
                <a href="index2.html" class="type"><img src="images/page1_img1.jpg" alt=""><span class="type_caption">Economy</span></a>
                <a href="index2.html" class="type"><img src="images/page1_img2.jpg" alt=""><span class="type_caption">Standard</span></a>
                <a href="index2.html" class="type"><img src="images/page1_img3.jpg" alt=""><span class="type_caption">Lux</span></a>
            </div>
        </div>
    </div>

    <!--==============================footer=================================-->
    <div th:insert="~{fragments/footer :: footer}"></div>
</div>

<script>
    $(function () {
        $('#bookingForm input, #bookingForm textarea').placeholder();
    });
</script>
</body>
</html>
